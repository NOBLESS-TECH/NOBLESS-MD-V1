<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#05000a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* GRID BACKGROUND */

body::before{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(255,0,80,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,80,.08) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:0;
}

/* CONTAINER */

.container{
    width:95%;
    max-width:430px;
    z-index:2;
    position:relative;
    padding:20px;
}

/* TITLE */

.title{
    text-align:center;
    font-size:35px;
    color:#ff004c;
    font-weight:700;
    text-shadow:0 0 20px #ff004c;
    margin-bottom:25px;
}

/* LINKS */

.links{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

a{
    text-decoration:none;
    color:white;
}

.card{
    background:rgba(255,0,80,.08);
    border:1px solid rgba(255,0,80,.3);
    border-radius:18px;
    padding:18px;
    transition:.3s;
    box-shadow:0 0 15px rgba(255,0,80,.2);
    backdrop-filter:blur(8px);
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 25px #ff004c;
}

.card h3{
    color:#ff5c8a;
    font-size:13px;
    margin-bottom:5px;
}

.card p{
    font-size:18px;
    font-weight:bold;
}

/* PAIR BOX */

.pair-box{
    background:rgba(255,0,80,.08);
    border:1px solid rgba(255,0,80,.3);
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,0,80,.2);
}

.pair-box h1{
    font-size:30px;
    color:#ff5c8a;
    margin-bottom:10px;
}

.pair-box span{
    color:#999;
    font-size:14px;
}

/* INPUT */

input{
    width:100%;
    margin-top:25px;
    padding:18px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#14000d;
    border:1px solid #ff004c;
    color:white;
    font-size:20px;
    margin-bottom:15px;
}

/* BUTTON */

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,#ff004c,#ff2e63);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,0,80,.5);
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 30px #ff004c;
}

/* STATUS */

.status{
    margin-top:20px;
    background:#1a000c;
    border:1px solid #ff004c;
    border-radius:15px;
    padding:15px;
    color:#ff5c8a;
    font-size:17px;
}

/* FOOTER */

.footer{
    margin-top:25px;
    text-align:center;
    color:#666;
    font-size:12px;
    line-height:20px;
}

.footer span{
    color:#ff004c;
}

/* SOUND BUTTON */

.sound{
    position:fixed;
    bottom:20px;
    right:20px;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#ff004c;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    box-shadow:0 0 30px #ff004c;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 10px #ff004c;
    }

    50%{
        box-shadow:0 0 35px #ff004c;
    }

    100%{
        box-shadow:0 0 10px #ff004c;
    }
}

</style>
</head>
